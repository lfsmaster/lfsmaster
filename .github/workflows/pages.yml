name: Publicar portfólio Middea no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar nova versão premium do portfólio
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip

          payload = """"""
          html = gzip.decompress(base64.b64decode(payload)).decode("utf-8")
          Path("index.html").write_text(html, encoding="utf-8")

      - name: Registrar atualização no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza portfólio premium [skip ci]"
            git push origin HEAD:main
          fi

      - name: Sincronizar branch gh-pages
        run: git push origin HEAD:gh-pages --force

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4