name: Publicar portfólio Middea no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inserir imagens no portfólio
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="portfolio-images-v6.js"></script>'
          css = '<style id="portfolio-image-mode">#portfolio video{display:none!important}</style>'
          if 'id="portfolio-image-mode"' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          if tag not in s:
              s = s.replace('</body>', tag + '</body>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Verificar arquivos
        run: |
          test -s index.html
          test -s portfolio-images-v6.js
          test -s assets/portfolio/branding.svg
          test -s assets/portfolio/social-media.svg
          test -s assets/portfolio/web-design.svg
          test -s assets/portfolio/audiovisual.svg
          test -s assets/portfolio/libras.svg
          test -s assets/portfolio/campaign.svg
          test -s assets/portfolio/print.svg
          test -s assets/portfolio/photography.svg
          grep -q 'portfolio-images-v6.js' index.html

      - name: Salvar e sincronizar a versão publicada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Ativa imagens representativas no portfólio"
            git push origin HEAD:main
          fi
          git push origin HEAD:gh-pages --force

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
