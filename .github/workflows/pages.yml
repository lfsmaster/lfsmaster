name: Publicar portfólio Middea no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar revisão premium do portfólio
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")

          # Remove integrações antigas e qualquer referência a bancos de vídeos externos.
          old_scripts = [
              "libras-portfolio.js",
              "middea-original-videos.js",
              "portfolio-v2.js",
              "portfolio-review-v3.js",
          ]
          for name in old_scripts:
              content = re.sub(rf'<script\s+src=["\']{re.escape(name)}["\']\s*></script>', '', content)

          content = re.sub(r'https://www\.pexels\.com/download/video/[^"\']+', '', content)
          content = re.sub(r'https://dnznrvs05pmza\.cloudfront\.net/[^"\']+', '', content)
          content = content.replace("Vídeos de apoio: Pexels.", "Demonstrações em motion design produzidas para o portfólio da Middea.")
          content = content.replace("Pexels", "motion design original")

          script = '<script src="portfolio-review-v3.js"></script>'
          content = content.replace("</body>", f"{script}</body>", 1)
          path.write_text(content, encoding="utf-8")

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4