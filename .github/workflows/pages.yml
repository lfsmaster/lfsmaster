name: Publicar portfólio Middea no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar conteúdo e recursos do site
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")
          old = "Este site apresenta tudo o que a agência pode construir: estratégia, branding, conteúdo, campanhas, websites, audiovisual, fotografia, materiais impressos e experiências acessíveis."
          new = "Na Middea, transformamos ideias em marcas, conteúdos e experiências que aproximam pessoas, fortalecem negócios e geram resultados."

          if old in content:
              content = content.replace(old, new, 1)
          elif new not in content:
              raise SystemExit("A mensagem principal não foi encontrada no index.html.")

          portfolio_script = '<script src="portfolio-v2.js"></script>'
          if portfolio_script not in content:
              content = content.replace("</body>", f"{portfolio_script}</body>", 1)

          path.write_text(content, encoding="utf-8")

      - name: Registrar atualização no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Integra vídeo e conteúdo na área de portfólio"
            git push origin HEAD:main
          fi

      - name: Sincronizar branch gh-pages
        run: git push origin HEAD:gh-pages --force

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4