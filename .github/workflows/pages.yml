name: Publicar portfólio Middea no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Integrar Libras e vídeos originais
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")
          scripts = [
              '<script src="libras-portfolio.js"></script>',
              '<script src="middea-original-videos.js"></script>'
          ]

          for script in scripts:
              if script not in content:
                  content = content.replace("</body>", f"{script}</body>", 1)

          content = content.replace("Vídeos de apoio: Pexels.", "Vídeos demonstrativos originais produzidos para o portfólio da Middea.")
          content = content.replace("Pexels", "produção original Middea")
          path.write_text(content, encoding="utf-8")

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4