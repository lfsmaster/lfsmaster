name: Publicar portfólio Middea no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar versão com imagens
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'modal-process-image' index.html
          grep -q 'project-image' index.html
          grep -q 'Conteúdo com tradução em Libras' index.html
          if grep -q 'data-video=' index.html; then
            echo "A área do portfólio ainda contém vídeos."
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
